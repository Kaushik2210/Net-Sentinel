# Production-style stack: Caddy terminates TLS (automatic Let's Encrypt for a real DOMAIN) and routes
#   /api/*, /health, /docs, /openapi.json  -> api
#   everything else                        -> web
# Only Caddy publishes ports; the API, web and database are reachable only on the internal network.
#
# Usage (from the repo root):
#   cp infrastructure/docker/prod.env.example .env.prod   # fill in every value
#   docker compose -p netsentinel -f infrastructure/docker/docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: netsentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: netsentinel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsentinel"]
      interval: 5s
      retries: 10

  api:
    build: ../../apps/api
    restart: unless-stopped
    # --proxy-headers: trust X-Forwarded-For from Caddy (the only thing that can reach this container), so
    # rate limits and audit logs see real client addresses instead of the proxy's.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://netsentinel:${POSTGRES_PASSWORD}@db:5432/netsentinel
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN}  # the WebSocket check also accepts the serving host itself
      TELEMETRY_MODE: simulation
      # Public, read-only: only a viewer account is created. Leave the others unset on purpose.
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD:?set SEED_VIEWER_PASSWORD}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ../../apps/web
      args:
        # Empty = same origin: the browser calls /api/v1/... and wss://<host>/api/v1/ws/stream on whatever host served the page,
        # so the image works for any domain or tunnel hostname.
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
